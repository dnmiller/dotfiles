# 24-bit RGB color: advertise a color-capable TERM inside tmux, and tell tmux
# the outer terminal supports RGB. terminal-features needs tmux >= 3.2;
# terminal-overrides Tc covers older versions.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

set -g mouse on

# Pass Esc through immediately; the 500ms default delays it and merges a quick
# Esc Esc into one Meta-Esc (breaks opencode's interrupt; LazyVim warns too).
set -sg escape-time 10

# Cmd+h/j/k/l moves pane focus. Terminals never forward Cmd, so Ghostty
# (home/.config/ghostty/config) sends these private sequences instead; Alt+hjkl
# would collide with LazyVim's Alt+j/k line moves.
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
set -s user-keys[2] "\e[9003~"
set -s user-keys[3] "\e[9004~"
bind -n User0 select-pane -L
bind -n User1 select-pane -D
bind -n User2 select-pane -U
bind -n User3 select-pane -R

# Right-click always opens tmux's pane menu, even over apps that capture the
# mouse (e.g. Neovim). This is tmux's default M-MouseDown3Pane menu; the stock
# MouseDown3Pane forwards the click to the app instead.
bind -n MouseDown3Pane display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
  "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } \
  "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } \
  '' \
  "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward "#{q:mouse_word}" } \
  "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } \
  "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } \
  "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } \
  '' \
  "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } \
  "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } \
  '' \
  "Horizontal Split" h { split-window -h } \
  "Vertical Split" v { split-window -v } \
  '' \
  "#{?#{>:#{window_panes},1},,-}Swap Up" u { swap-pane -U } \
  "#{?#{>:#{window_panes},1},,-}Swap Down" d { swap-pane -D } \
  "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } \
  '' \
  Kill X { kill-pane } \
  Respawn R { respawn-pane -k } \
  "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
  "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }

# Allow apps inside tmux to write to the system clipboard
set -g set-clipboard on

# Required for some terminals to pass escape sequences
set -g allow-passthrough on
